<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Notepad – Register</title>
</head>

<body>
    <h2>Register</h2>
    <form action="/register" method="POST">
        <input name="username" placeholder="Choose a username" required><br><br>
        <input name="password" type="password" placeholder="Create a password" required><br><br>
        <button>Sign Up</button>
    </form>
    <p>Already have an account? <a href="/">Login here</a></p>
</body>

</html>
