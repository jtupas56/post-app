<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h4 mb-4">Account Details</h1>
                        <p class="mb-2"><strong>Username:</strong> {{username}}</p>
                        <p class="mb-0"><strong>Password:</strong> {{password}}</p>
                        <div class="mt-4">
                            <a href="/dashboard?uid={{uid}}&username={{username}}" class="btn btn-secondary w-100">Back
                                to Dashboard</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
