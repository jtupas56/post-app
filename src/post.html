<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-xl-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="h4 mb-0">Account: {{username}}</h1>
          </div>
          <div class="d-flex gap-2">
            <form action="/delete-account" method="POST" class="m-0">
              <input type="hidden" name="_csrf" value="{{csrfToken}}">
              <button type="submit" class="btn btn-outline-danger btn-sm">Delete Account</button>
            </form>
            <a href="/logout" class="btn btn-outline-secondary btn-sm">Logout</a>
          </div>
        </div>

        <div class="card mb-4 shadow-sm">
          <div class="card-body">
            <h2 class="h5 mb-3">Add a Post</h2>
            <form action="/add-post" method="POST">
              <input type="hidden" name="_csrf" value="{{csrfToken}}">
              <div class="mb-3">
                <textarea name="content" class="form-control" rows="4" placeholder="Write something..."
                  required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Post</button>
            </form>
          </div>
        </div>

        <div class="alert alert-warning mb-4" role="alert">
          <strong>Stored XSS test:</strong> submit content like <code>&lt;script&gt;alert(1)&lt;/script&gt;</code>.
          If the script runs when the page reloads, the post display is vulnerable.
        </div>
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 mb-3">All Posts</h2>
            <ul class="list-group">{{post_list}}</ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
