version: 2.1
orbs:
  node: circleci/node@5.0.2
jobs:
  build-and-test:
    executor: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          command: npm test
          name: Run tests
workflows:
  test-my-app:
    jobs:
      - build-and-test